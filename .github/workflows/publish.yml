name: Lint, Test, and Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test -- --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false

  build-whisper:
    name: Build whisper.cpp server
    runs-on: windows-latest
    env:
      VULKAN_VERSION: 1.4.357.0
      SDL2_VERSION: 2.30.9
    steps:
      - uses: actions/checkout@v7

      - name: Read whisper.cpp version
        id: version
        shell: pwsh
        run: |
          $tag = (Get-Content whisper.version -Raw).Trim()
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Restore cached build
        id: cache
        uses: actions/cache@v6
        with:
          path: whisper-dist
          key: whisper-${{ steps.version.outputs.tag }}-vulkan-${{ env.VULKAN_VERSION }}-sdl2-${{ env.SDL2_VERSION }}-v1

      - name: Checkout whisper.cpp
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ steps.version.outputs.tag }}
          path: whisper.cpp

      - name: Install Vulkan SDK
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Fetch SDL2
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/libsdl-org/SDL/releases/download/release-${env:SDL2_VERSION}/SDL2-devel-${env:SDL2_VERSION}-VC.zip"
          curl.exe -sL -o "$env:RUNNER_TEMP/sdl2.zip" $url
          if ($LASTEXITCODE -ne 0) { throw "SDL2 download failed: $url" }
          7z x "$env:RUNNER_TEMP/sdl2.zip" -o"$env:RUNNER_TEMP" | Out-Null
          $sdlRoot = "$env:RUNNER_TEMP/SDL2-${env:SDL2_VERSION}"
          if (-not (Test-Path "$sdlRoot/cmake")) { throw "SDL2 layout unexpected under $sdlRoot" }
          Add-Content $env:GITHUB_ENV "SDL2_DIR=$sdlRoot/cmake"
          Add-Content $env:GITHUB_ENV "SDL2_LIB_DIR=$sdlRoot/lib/x64"

      - name: Build CPU and Vulkan servers
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: whisper.cpp
        run: |
          $common = @(
            '-DCMAKE_BUILD_TYPE=Release',
            '-DBUILD_SHARED_LIBS=ON',
            '-DWHISPER_BUILD_TESTS=OFF',
            '-DWHISPER_BUILD_EXAMPLES=ON',
            '-DWHISPER_BUILD_SERVER=ON',
            '-DGGML_NATIVE=OFF',
            '-DGGML_BACKEND_DL=ON',
            '-DGGML_CPU_ALL_VARIANTS=ON',
            '-DWHISPER_SDL2=ON'
          )
          cmake -B build-cpu @common
          if ($LASTEXITCODE -ne 0) { throw 'cmake configure (cpu) failed' }
          cmake --build build-cpu --config Release -j 4
          if ($LASTEXITCODE -ne 0) { throw 'cmake build (cpu) failed' }
          cmake -B build-vulkan @common -DGGML_VULKAN=ON
          if ($LASTEXITCODE -ne 0) { throw 'cmake configure (vulkan) failed' }
          cmake --build build-vulkan --config Release -j 4
          if ($LASTEXITCODE -ne 0) { throw 'cmake build (vulkan) failed' }

          foreach ($backend in 'cpu', 'vulkan') {
            $out = "../whisper-dist/$backend"
            New-Item -ItemType Directory -Force $out | Out-Null
            Copy-Item "build-$backend/bin/Release/whisper-server.exe" $out
            Copy-Item "build-$backend/bin/Release/whisper-stream.exe" $out
            Copy-Item "build-$backend/bin/Release/*.dll" $out
            Copy-Item "$env:SDL2_LIB_DIR/SDL2.dll" $out
          }
          Set-Content -Path ../whisper-dist/VERSION -Value '${{ steps.version.outputs.tag }}' -NoNewline

      - name: Smoke test CPU server
        shell: pwsh
        run: |
          curl.exe -sL -o "$env:RUNNER_TEMP/ggml-tiny.en.bin" https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
          $hash = (Get-FileHash "$env:RUNNER_TEMP/ggml-tiny.en.bin" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f') { throw "tiny.en checksum mismatch: $hash" }
          curl.exe -sL -o "$env:RUNNER_TEMP/jfk.wav" "https://raw.githubusercontent.com/ggml-org/whisper.cpp/${{ steps.version.outputs.tag }}/samples/jfk.wav"

          $server = Start-Process -FilePath whisper-dist/cpu/whisper-server.exe -PassThru -NoNewWindow -ArgumentList @(
            '-m', "$env:RUNNER_TEMP/ggml-tiny.en.bin", '--host', '127.0.0.1', '--port', '18080',
            '--inference-path', '/v1/audio/transcriptions')
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18080/health).StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'whisper-server did not become ready' }
            $text = curl.exe -s -F "file=@$env:RUNNER_TEMP/jfk.wav" -F response_format=json http://127.0.0.1:18080/v1/audio/transcriptions
            Write-Output $text
            if ($text -notmatch 'ask not') { throw 'Unexpected transcription output' }
          } finally {
            Stop-Process -Id $server.Id -Force
          }

      - name: Check Vulkan server launches
        shell: pwsh
        run: |
          & whisper-dist/vulkan/whisper-server.exe --help *> $null
          if ($LASTEXITCODE -ne 0) { throw "vulkan whisper-server --help exited with $LASTEXITCODE" }

      - name: Check whisper-stream binaries launch
        shell: pwsh
        run: |
          foreach ($backend in 'cpu', 'vulkan') {
            $out = & "whisper-dist/$backend/whisper-stream.exe" --help 2>&1 | Out-String
            if ($out -notmatch 'capture device') { throw "$backend whisper-stream.exe --help did not print usage" }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: whisper-server
          path: whisper-dist
          if-no-files-found: error

  build-and-release:
    name: Build and Release
    runs-on: windows-latest
    needs: [lint, test, build-whisper]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v7

      - name: Download whisper.cpp server
        uses: actions/download-artifact@v8
        with:
          name: whisper-server
          path: resources/whisper

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update version from tag
        run: |
          $version = "${{ github.ref }}" -replace 'refs/tags/v', ''
          npm version $version --no-git-tag-version --allow-same-version

      - name: Build TypeScript
        run: npm run build

      # Build only. electron-builder's own publisher creates one GitHub release
      # per uploaded artifact when the release does not exist yet, which splits
      # the installer and its metadata across two releases sharing the tag.
      - name: Build Windows installer
        run: npm run build:windows -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.blockmap' -or $_.Name -eq 'latest.yml' }
          if (-not $files) { throw "No installer artifacts found in release/" }
          $files | ForEach-Object { Write-Output ("publishing " + $_.Name + " (" + [math]::Round($_.Length / 1MB, 1) + " MB)") }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @($files.FullName) --clobber
          } else {
            gh release create $tag @($files.FullName) --title $tag --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "publishing the release failed" }

          gh release view $tag --json assets --jq '.assets[].name'

