appId: com.whisperdesktop.app
productName: Whisper Desktop

directories:
  buildResources: assets
  output: release

files:
  - dist/**/*
  - "!dist/__tests__"
  - "!dist/**/*.test.*"
  - "!dist/**/*.map"
  - assets/**/*
  - public/**/*
  - package.json

extraResources:
  - from: resources/whisper
    to: whisper
    filter:
      - "**/*"

asar: true

asarUnpack:
  - node_modules/node-mic/**/*

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: assets/whisper.ico
  uninstallerIcon: assets/whisper.ico
  installerHeaderIcon: assets/whisper.ico
  runAfterFinish: true
  artifactName: ${productName}.${ext}

extraMetadata:
  main: dist/main.js

publish:
  provider: github
  owner: dniasoff
  repo: whisper-desktop
  releaseType: release
