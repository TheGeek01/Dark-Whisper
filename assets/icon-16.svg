<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Dark-Whisper icon for 16, 20 and 32 px: four thicker bars on whole pixels (also at 2x). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262a63"/>
      <stop offset="1" stop-color="#0f1020"/>
    </linearGradient>
    <linearGradient id="bars" gradientUnits="userSpaceOnUse" x1="0" y1="3" x2="0" y2="13">
      <stop offset="0" stop-color="#d2cbff"/>
      <stop offset="1" stop-color="#7d6fff"/>
    </linearGradient>
  </defs>
  <rect width="16" height="16" rx="3.5" fill="url(#bg)"/>
  <g fill="url(#bars)">
    <rect x="3" y="5" width="2" height="6" rx="1"/>
    <rect x="6" y="3" width="2" height="10" rx="1"/>
    <rect x="9" y="4" width="2" height="8" rx="1"/>
    <rect x="12" y="6" width="2" height="4" rx="1"/>
  </g>
</svg>
